<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      [2026-08-22追加・本部長] Expo標準テンプレートにはviewport-fit=coverが無く、
      react-native-safe-area-contextのWeb実装（env(safe-area-inset-*)を読む仕組み）が
      常に0を返してしまい、子ども向けタブバー（app/child/(tabs)/_layout.tsxの
      useSafeAreaInsets().bottom加算）が実機のホームインジケーター等に対して
      効かなかった。viewport-fit=coverを追加し、ブラウザにsafe area insetを
      計算させるようにした（public/index.htmlはExpo webのテンプレートを
      プロジェクト側で上書きする正規の仕組み）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
        [2026-08-22追加・本部長] スマホのブラウザ実機で、下部タブバー（やる/きろく等）の
        アイコンや文字が半分切れて見えなくなる不具合が報告された。height:100%は
        アドレスバーの表示・非表示で変わる「実際に見えている高さ」ではなく、
        端末・ブラウザによっては固定された基準の高さを参照してしまうことがあり、
        その差分ぶんだけ画面下部（タブバー）が表示領域からはみ出し、bodyの
        overflow:hiddenによりスクロールでも見えなくなっていたと考えられる。
        100dvh（dynamic viewport height：今まさに見えている高さに追従する単位）に
        対応しているブラウザでは、そちらを優先させることで実際の表示領域と
        レイアウトの高さを一致させる（非対応ブラウザは上のheight:100%のまま）。
      */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
