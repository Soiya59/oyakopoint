name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # [2026-09-09追加・本部長] フックの規則違反をここで止める。
      # 2026-09-09、useStateを早期リターンより後ろに置いたままデプロイし、
      # 本番でメダル購入画面が表示できなくなった（実装メモ178章）。
      # `tsc --noEmit`は型の問題ではないこの誤りを検出しない。
      # **lintが落ちたらデプロイもしない。**この順序を入れ替えないこと。
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # GitHub PagesはSPAのクライアント側ルーティングをネイティブサポートしないため、
      # index.htmlを404.htmlとしても配置する（存在しないパスへの直アクセス時にSPAの
      # 殻を返し、あとはexpo-routerのクライアント側ルーティングに委ねる定番の回避策）。
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
